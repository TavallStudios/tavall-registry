name: Publish locked Gradle artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version required by downstream dependency locks
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TAVALL_VERSION: ${{ inputs.version }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon --max-workers=1 -PtavallVersion="$TAVALL_VERSION" clean check publish
